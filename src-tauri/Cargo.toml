[package]
name = "ai-workbench"
version = "1.0.2"
description = "Local-first multimodal AI workbench"
edition = "2021"

[lib]
name = "ai_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ModelDeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "stream", "socks"] }
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
opt-level = 3
panic = "abort"
